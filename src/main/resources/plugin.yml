main: org.craftcore.stellaria.StellariaCore
version: ${version}
name: StellariaCore
author: Nyaffle, shu4700
description: Feature plugin for Stellaria MC
api-version: 1.21

depend: [Citizens, packetevents, Vault, PlaceholderAPI]
softdepend: [LuckPerms, NuVotifier]

commands:
  tpa:
  tpaccept:
  tpdeny:
  tphere:
  tphaccept:
  tphdeny:
  stellariareload:
    permission: stellaria.reload
  afk:
  heal:
    permission: stellaria.heal
  broadcast:
    aliases: [bc]
    permission: stellaria.broadcast
  msg:
    aliases: [tell, w, message]
  reply:
    aliases: [r]
  mute:
    permission: stellaria.mute
  unmute:
    permission: stellaria.mute
  pay:
  eco:
    permission: stellaria.eco
  balance:
    aliases: [money, bal]
  colors:
    permission: stellaria.chat.color
  discord:
    aliases: [dc]
  vote:
  playtime:
  seen:
  ranking:
    aliases: [rank]
  scoreboard:
    aliases: [sb]
  sethome:
  home:
  delhome:
  homes:
  setwarp:
  warp:
  delwarp:
  warps:
  weathervote:
  wvaccept:
  wvdeny:
  timevote:
  tvaccept:
  tvdeny:
  kikori:
  land:

permissions:
  stellaria.msg:
    default: true
  stellaria.pay:
    default: true
  stellaria.balance:
    default: true
  stellaria.playtime:
    default: true
  stellaria.seen:
    default: true
  stellaria.ranking:
    default: true
  stellaria.scoreboard:
    default: true
  stellaria.home:
    default: true
  stellaria.warp:
    default: true
  stellaria.land:
    default: true
  stellaria.land.admin:
    default: op
  stellaria.admin:
    description: Stellaria運営用コマンドの一括権限。個々の権限はここから継承される。
    default: op
    children:
      stellaria.reload: true
      stellaria.broadcast: true
      stellaria.mute: true
      stellaria.eco: true
      stellaria.chat.color: true
      stellaria.heal: true
  stellaria.reload:
    default: false
  stellaria.broadcast:
    default: false
  stellaria.mute:
    default: false
  stellaria.eco:
    default: false
  stellaria.chat.color:
    default: false
  stellaria.heal:
    default: false
