# StellariaCore 設定ファイル

server:
  name: "Stellaria"
  prefix: "&%9&l| すてらりあ &r" # メッセージのPrefix !NOTE: 未実装

discord:
  invite: "https://discord.gg/ssaREjBJXg" # /discord で案内するサーバー招待リンク
  bot:
    enabled: true
    token: ""
    server-guild-id: "1547187819410358292"
    serverchat-channel-id: ["1549566387435872387"]
    modlog-channel-id: ["1550003261942005790"]
    report-channel-id: ["1550003261942005790"]
    serverstartlog-format: "✅ サーバーが起動しました。"
    serverstoplog-format: "❌ サーバーが停止しました。"
    serverchat-format: "%message%"
    player-name-format: "%player%"
    #    player-name-format: "%rank_tag% %player%" # 見にくいためランクは非表示
    status-format: "%online%/%max_online% online"
    discordchat-format: "&%7[&%9Discord&%7] &%7%username%&%8: &r%message%"
    joinlog-format: "**%player%が参加しました。**"
    quitlog-format: "**%player%が退出しました。**"

map:
  link: "https://map.craftcore.org" #

homepage:
  link: "https://craftcore.org/stellaria"
  craftcore-link: "https://craftcore.org" #

vote:
  enabled: true

  reward:
    money: 500

  message:
    - "&%8----------------------------------"
    - ""
    - "  &%9&lサーバー投票"
    - ""
    - "  &%7サーバーに投票するとサーバー内通貨が貰えます。"
    - ""
    - "    %jms%     %mineportal%"
    - ""
    - "&%8----------------------------------"

  broadcast:
    enabled: true

    message:
      - "&%8----------------------------------"
      - ""
      - "  &%f%player% &%aさんが投票しました！"
      - ""
      - "  &%7サーバーに投票するとサーバー内通貨が貰えます。"
      - ""
      - "    %jms%     %mineportal%"
      - ""
      - "&%8----------------------------------"

  sites:
    jms:
      enabled: true
      name: "&%3&lJMS"
      url: "https://minecraft.jp/servers/stellaria.craftcore.org"
      tooltip: "&%7クリックして&%3JMS&%7の投票ページを開く"

    mineportal:
      enabled: true
      name: "&%d&lMinePortal"
      url: "https://mineportal.jp/servers/cmu54wi1o0000ofujlywoxbwk"
      tooltip: "&%7クリックして&%dMinePortal&%7の投票ページを開く"
rank:
  enabled: true
  default:
    color: "&%7"
  groups: # 上に書いた方が優先。luckperms-group はLuckPerms側の実グループ名
    - luckperms-group: "admin"
      color: "&%e"
      tablist-tag: "ᴀᴅᴍɪɴ"
      display-name: "管理者"
    - luckperms-group: "staff"
      color: "&%b"
      tablist-tag: "sᴛᴀꜰꜰ"
      display-name: "スタッフ"
    - luckperms-group: "booster"
      color: "&%d"
      tablist-tag: "ʙᴏᴏsᴛᴇʀ"
      display-name: "ブースター"

economy:
  default-balance: 1000 # 新規プレイヤーの初期所持金

world:
  gui-title: "&%9ワールドを選択"
  gui-rows: 3 # 1〜6で固定行数。0または範囲外ならワールド数から自動計算（例: 6）
  # GUIに表示するワールドのリスト。並び順がそのままGUIの配置順になります。
  # ワールド名(world)は必須。表示名(name)、カスタムヘッド(custom-head)、
  # 素材(material)、説明文(lore)、スロット(slot)は省略可能です。
  # ※ 未設定時はサーバー上の全ワールドを自動表示します。
  worlds:
    - world: "world"
      name: "&%a生活ワールド"
      #      custom-head: "earth"
      material: GRASS_BLOCK
      slot: 11
      lore:
        - "&%7メインの生活ワールドです"

    - world: "lobby"
      name: "&%bロビー"
      custom-head: "earth"
      material: GRASS_BLOCK
      slot: 13
      lore:
        - "&%7ロビーワールドです"

    - world: "resource"
      name: "&%e資源ワールド"
      #      custom-head: "earth"
      material: HAY_BLOCK
      slot: 15
      lore:
        - "&%7資源ワールドです"
  # Bukkit上のワールド名をGUIやプレースホルダーに表示する名前へ置き換える（未設定のワールドは元の名前を表示）
  # ※ 上記 worlds の各項目で name を指定した場合はそちらが優先されます
  display-names: {}
  # ワールド名ごとにcustomhead.ymlのヘッドIDを指定できる（上記 worlds の各項目で custom-head を指定した場合はそちらが優先）
  gui-custom-heads:
    lobby: "earth"

lobby:
  world: "lobby"

home:
  disabled-worlds: ["lobby"]
  max-per-player: 5
  cost: 200 # /sethome 1回あたりの消費コイン数（0なら無料）
  delete-refund-rate: 0.5 # /delhome時にcostのこの割合を返金（0で返金なし、1で全額）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#FFAA00" # オレンジ
    size: 1.0
    radius: 1.0
    points: 30

warp:
  disabled-worlds: ["lobby"]
  max-per-player: 5
  cost: 300 # /setwarp 1回あたりの消費コイン数（0なら無料）
  delete-refund-rate: 0.5 # /delwarp時にcostのこの割合を所有者へ返金（0で返金なし、1で全額）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#55FF55" # グリーン
    size: 1.0
    radius: 1.0
    points: 30

ranking:
  page-size: 10

profile:
  info-lines:
    - "&%7名前: &%f%player%"
    - "&%7プレイ時間: &%f%playtime%"
    - "&%7所持金: &%e%money%"

welcome:
  enabled: true # 初回ログイン時にウェルカムメッセージ（messages.yml の welcome.lines）を送るかどうか

first-join-kit:
  enabled: true
  items: # "素材名:個数" 形式（個数省略で1個）
    - "WOODEN_SWORD:1"
    - "WOODEN_AXE:1"
    - "WOODEN_PICKAXE:1"
    - "WOODEN_SHOVEL:1"
    - "COOKED_BEEF:16"
    - "OAK_LOG:16"

adminshop:
  enabled: true
  rows: 3
  items:
    - material: BREAD
      price: 10
      slot: 11
    - material: CARROT
      price: 10
      slot: 12
    - material: POTATO
      price: 10
      slot: 13
    - material: COOKED_BEEF
      price: 15
      slot: 14
    - material: OAK_LOG
      price: 20
      slot: 15

action-bar:
  enabled: true
  update-interval-ticks: 5
  separator: " &%7|&r " # 複数機能が同時にアクションバーを使うときの連結セパレータ
  persistent:
    enabled: false # 常時表示する固定テンプレートを使うかどうか
    template: ""

boss-bar:
  enabled: true
  update-interval-ticks: 5 # 期限切れチャンネル(flash)を消すためのチェック間隔。テンプレートは持たず、呼び出し側の機能がtitle/color/overlay/progressを渡す

scoreboard:
  title: "&%9&lすてらりあ"
  update-interval-ticks: 20
  hide-numbers: true
  lines:
    - ""
    - " &%bワールド&%7: &%f%world%  "
    - " &%b座標&%7: &%f%x%&%7,&%f %y%&%7,&%f %z%  "
    - " &%b所持金&%7: &%f%money%  "
    - ""


tablist:
  header: "\n&%b%player%さん\n           &%9すてらりあ &%bへようこそ！           \n"
  footer: "\n&%9%online%&%7人がオンライン"
  value: "%afk%&%a%ping%ms"
  rank-prefix: "" # ランクタグの前に付ける区切り文字（ランク色で色付けされる）
  update-interval-ticks: 20

belowname:
  title: ""
  value: "%afk% &%c❤ &%7%health%"
  update-interval-ticks: 20

nametag:
  enabled: true
  dot-symbol: "●" # ネームタグ左端に付けるランク色ドット（ランク無しのプレイヤーには付かない）
  update-interval-ticks: 20

afk:
  enabled: true
  timeout-seconds: 300 # 何秒操作が無ければAFK扱いにするか
  actionbar-flash-seconds: 3 # AFK復帰通知をアクションバーに表示する秒数
  tag: "&c[&%c離席中&c] &r" # %afk% プレースホルダーの中身

chat:
  enabled: true
  format: "{placeholder}{sender}&%9: &%f{message}"
  placeholder: ""
  click-to-message: true
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  tooltip:
    enabled: true
    lines:
      - "&%7名前: &%f%player%"
      - "&%7Ping: &%a%ping%ms"
      - "&%7プレイ時間: &%b%playtime%"
      - "&%7所持金: &%e%money%"
      - ""
  near:
    enabled: true # 先頭に ! を付けた近距離チャット機能そのもののON/OFF
    max-viewers-shown: 5 # 見た人一覧のホバーに名前を出す最大人数（超えた分は「...他n人」）
    range-1: 8   # ! 1個（1段階目）の範囲（ブロック数）
    range-2: 16  # ! 2個（2段階目）の範囲（ブロック数）
    range-3: 32  # ! 3個以上（3段階目）の範囲（ブロック数）
    format-1: "&%f{placeholder}{sender}&#F52765: &%f{message}"
    format-2: "&%f{placeholder}{sender}&#9F27F5: &%f{message}"
    format-3: "&%f{placeholder}{sender}&#413BF5: &%f{message}"

message:
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

mute:
  level3-command-blacklist: ["msg","tell","w","reply","r","tpa","tphere"] # Lv3ミュート中に禁止するコマンド名（例: ["msg","tell","w","reply","r"]）

moderation:
  warn-sound:
    enabled: true
    name: "BLOCK_NOTE_BLOCK_BASS"
    volume: 1.0
    pitch: 0.8

report:
  categories:
    - name: "&%c&l暴言"
      material: PAPER
      slot: 10
    - name: "&%e&lチート"
      material: PAPER
      slot: 12
    - name: "&%6&l荒らし"
      material: PAPER
      slot: 14
    - name: "&%7&lその他"
      material: PAPER
      slot: 16


tpa:
  teleport-delay-seconds: 5 # 承認後、実際にテレポートするまでの詠唱時間。0以下で即時テレポート。ダメージを受けるとキャンセルされる

teleport-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#55FFFF"
  size: 1.0
  radius: 1.0
  points: 30

join-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#4C2FB3"
  size: 1.0
  radius: 1.0
  points: 30

mention:
  enabled: true
  format: "&%e@{name}&r"
  all:
    enabled: true
    keyword: "all"
    permission: "stellaria.chat.mention.all"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

broadcast:
  auto:
    enabled: true
    interval-minutes: 15 # 本番は15
    messages: [
      "&%b&l| &r&%bDiscordサーバーはこちら！\n&%b&l| &r&%bhttps://discord.gg/ssaREjBJXg",
      "&%b&l| &r&%b荒らし、チートは禁止です！",
      "&%b&l| &r&%bバグや不具合を見つけたらDiscordで報告できます！",
      "&%b&l| &r&%b資源ワールドは毎週金曜日12時にリセットされます！",
      "&%b&l| &r&%b/headshopでカスタムプレイヤーヘッドを購入できます！",
      "&%b&l| &r&%b/menuでメニューを開けます！",
      "&%b&l| &r&%bお金は釣り、鉱石採掘で入手できます！",
      "&%b&l| &r&%b詳細なゲーム仕様はDiscordで確認できます！",
    ] # 空だと定期放送は開始されない（例: ["&%eルールを守って楽しく遊ぼう！"]）

income:
  mining:
    rewards:
      COAL_ORE: 2
      COPPER_ORE: 2
      IRON_ORE: 5
      GOLD_ORE: 15
      REDSTONE_ORE: 5
      LAPIS_ORE: 5
      DIAMOND_ORE: 20
      EMERALD_ORE: 30
      NETHER_QUARTZ_ORE: 2
      NETHER_GOLD_ORE: 5
      ANCIENT_DEBRIS: 35

  fishing:
    rewards:
      COD: 20
      SALMON: 30
      PUFFERFISH: 500
      TROPICAL_FISH: 300

elevator:
  blocks:
    IRON_BLOCK:
      max: 10
    GOLD_BLOCK:
      max: 20
    DIAMOND_BLOCK:
      max: 50
  message:
    move_fail: "&%cこのエレベーターブロックには障害物があります"
    moveup_success: "&7↑"
    moveup_fail: "&%c行先のエレベーターブロックの上に障害物があります"
    movedown_success: "&7↓"
    movedown_fail: "&%c行先のエレベーターブロックの上に障害物があります"
  sound:
    moveup:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 1.0
    movedown:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 0.75
  ignoreblocks: ["&CARPET","&_SIGN","&TORCH","&BANNER","&BUTTON","&LEVER","&_DOOR"]# エレベーターブロックの上2ブロックに置いてあっても移動ができるブロック

weathervote:
  disabled-worlds: ["lobby"]
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "&%a生活ワールド"
    resource: "&%h資源ワールド"

timevote:
  disabled-worlds: ["lobby"]
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "&%a生活ワールド"
    resource: "&%g資源ワールド"


# world-time-sync.worlds に指定するワールドでは、時間投票を無効化するため
# disabled-worlds にも同じワールド名を追加してください。
world-time-sync:
  enabled: true
  worlds: ["lobby"]
  # 対象ワールド内で /gamerule advance_time false を実行してください。

kikori:
  disabled-worlds: ["lobby"]
  enabled: true
  price: 2000
  timeout-seconds: 300
  max-logs: 256
  leaf-radius: 4

mine:
  disabled-worlds: ["lobby"]
  enabled: true
  price: 2000
  timeout-seconds: 0
  max-ores: 128

rail:
  disabled-worlds: ["lobby"]
  speed:
    straight: 30.0  # 直線での最大速度 (blocks/s)
    curve: 16.0     # カーブでの最大速度 (blocks/s)
    slope: 20.0     # 坂道（上り/下り共通）での最大速度 (blocks/s)
  acceleration: 4.0       # 加速度 (blocks/s^2)
  deceleration: 8.0       # 減速度 (blocks/s^2)。カーブ・坂道・駅侵入前の制動に使う
  min-speed: 2.0          # 発車直後の初速、および「停止とみなす」しきい値 (blocks/s)
  max-velocity-clamp: 3.0 # 安全装置。1tickあたりの移動量の絶対上限 (blocks/tick)。Minecart#setMaxSpeedにも使う
  off-rail-grace-seconds: 2.0 # レールを外れてからこの秒数を超えたら高速モードを強制解除する
  off-rail-active-push-ticks: 4 # レールを外れてから最初の何tickだけ能動的に速度を維持し続けるか（平面交差点の1ブロック程度の隙間を確実に跨ぐため）
  chunk-preload:
    enabled: true
    distance: 2  # 進行方向に事前ロードするチャンク数
  station:
    arrival-radius: 0.5     # この距離以内かつ速度が min-speed 以下になったら「到着」とみなす (blocks)
    slow-down-margin: 1.3   # 制動距離の計算に掛ける安全マージン（大きいほど早めに減速し始める）
    max-path-search-blocks: 3000 # /rail depart 実行時、目的駅への経路をレール沿いに探索する最大距離 (blocks)
  fare:
    enabled: false # 将来の有料化用。現状は未使用（常に無料）
  gui:
    open-on-interact: true # レール上で高速モード対象外のトロッコに乗っている間、レールブロックを右クリックすると行き先GUIを開く（乗車直後はヒントをアクションバーに1tick遅らせて表示するだけで、GUI自体は自動では開かない）
  station-particle:
    enabled: true # 機能全体のON/OFF。実際に見えるかはプレイヤーごとの /rail particle 設定（既定OFF）による
    color: "#3399FF" # 目印の色（land.border-particleと同じ16進カラー指定）
    radius: 1.3       # 駅を中心にした円の半径 (blocks)
    size: 1.0
    interval-ticks: 20
    view-distance: 48 # プレイヤーからこの距離以内の駅だけ描画する（パフォーマンス用の間引き）
  arrival-announcement:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_BELL" # org.bukkit.Sound の列挙名
    volume: 1.0
    pitch: 1.0
    title-fade-in-ticks: 5
    title-stay-ticks: 40
    title-fade-out-ticks: 10

land:
  disabled-worlds: ["lobby"]
  cost-per-chunk: 50
  max-chunks-per-player: 300
  refund-on-unclaim: true
  map-radius: 4 # /land map で表示する範囲（チャンク単位の半径）。4なら9x9マスのグリッドになる
  protect:
    explosions: true
    fire: true
    pistons: true
    liquid-flow: true
    hangings: true
  # ドア・トラップドア・フェンスゲートはバニラのTag（DOORS/TRAPDOORS/FENCE_GATES）で自動判定するため、
  # ここに個別リストは持たない（新種のドアが追加されても自動的に保護対象になる）。
  protected-containers: ["CHEST","TRAPPED_CHEST","BARREL","ENDER_CHEST","SHULKER_BOX","WHITE_SHULKER_BOX","ORANGE_SHULKER_BOX","MAGENTA_SHULKER_BOX","LIGHT_BLUE_SHULKER_BOX","YELLOW_SHULKER_BOX","LIME_SHULKER_BOX","PINK_SHULKER_BOX","GRAY_SHULKER_BOX","LIGHT_GRAY_SHULKER_BOX","CYAN_SHULKER_BOX","PURPLE_SHULKER_BOX","BLUE_SHULKER_BOX","BROWN_SHULKER_BOX","GREEN_SHULKER_BOX","RED_SHULKER_BOX","BLACK_SHULKER_BOX","FURNACE","BLAST_FURNACE","SMOKER","HOPPER","DISPENSER","DROPPER","BREWING_STAND","ANVIL","CRAFTER","CHISELED_BOOKSHELF","LECTERN","DECORATED_POT","BEACON"]
  border-particle:
    enabled: true
    particle: "DUST"
    color: "#55FF55"
    size: 1.0
    duration-seconds: 3
    # /land border の常時表示用設定。半径はプレイヤーの現在地を中心にしたチャンク単位。
    toggle-radius-default: 3
    toggle-interval-ticks: 20
    # /chunkborder や /land border <半径> で指定できる半径の上限（チャンク単位）。
    # これを超えるキャッシュ構築要求はサーバー負荷が跳ね上がるため拒否する。
    max-radius: 64

# claim（/land）とは無関係に、ワールド単位でCreeper/TNT/エンドクリスタル/ウィザーによる地形破壊を無効化する設定。
# land.protect.explosionsはclaim済み土地のみを保護するが、こちらはworldsに指定したワールド全体が対象。
explosion-protection:
  worlds: [] # 対象ワールド名のリスト（例: ["world_the_end"]）。空なら何もしない
  creeper: true
  tnt: true # TNT付きトロッコも含む
  end-crystal: true
  wither: true # ウィザー本体の爆発・ウィザーの頭蓋骨・ウィザーが動いて壊すブロックすべて

menu:
  rows: 3 # 1〜6。省略/範囲外の場合は5
  items:
    - slot: 0
      material: PLAYER_HEAD
      name: "&%bプロフィール"
      action: "profile"
    - slot: 8
      material: ENDER_CHEST
      name: "&%2エンダーチェスト"
      action: "enderchest"
    - slot: 9
      material: EMERALD
      name: "&%aサーバー投票"
      action: "vote"
    - slot: 11
      material: SKELETON_SKULL
      name: "&%dヘッドショップ"
      action: "headshop"
    - slot: 13
      material: PLAYER_HEAD
      custom-head: "earth"
      name: "&%eワールド移動"
      action: "world"
    - slot: 15
      material: GOLDEN_PICKAXE
      name: "&%c便利機能"
      action: "features"
    - slot: 17
      material: CLOCK
      name: "&%6時間投票"
      action: "timevote"
    - slot: 18
      material: PAPER
      name: "&%2その他のリンク"
      action: "links"
    - slot: 19
      material: FILLED_MAP
      name: "&%2マップ"
      action: "map"
    - slot: 21
      material: RED_BED
      name: "&%9ホーム"
      action: "home"
    - slot: 23
      material: LODESTONE
      name: "&%3ワープ"
      action: "warp"
    - slot: 25
      material: COMPASS
      name: "&%9メニューアイテムを入手"
