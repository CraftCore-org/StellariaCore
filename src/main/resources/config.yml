# StellariaCore 設定ファイル

server:
  name: "Stellaria"
  prefix: "&%9&l| すてらりあ &r" # メッセージのPrefix !NOTE: 未実装

discord:
  invite: "https://discord.gg/ssaREjBJXg" # /discord で案内するサーバー招待リンク
  bot:
    enabled: true
    token: ""
    server-guild-id: "1547187819410358292"
    serverchat-channel-id: ["1549566387435872387"]
    modlog-channel-id: ["1550003261942005790"]
    report-channel-id: ["1550003261942005790"]
    serverstartlog-format: "✅ サーバーが起動しました。"
    serverstoplog-format: "❌ サーバーが停止しました。"
    serverchat-format: "%message%"
    player-name-format: "%player%"
#    player-name-format: "%rank_tag% %player%" # 見にくいためランクは非表示
    status-format: "%online%/%max_online% online"
    discordchat-format: "&%7[&%9Discord&%7] &%7%username%&%8: &r%message%"
    joinlog-format: "**%player%が参加しました。**"
    quitlog-format: "**%player%が退出しました。**"

map:
  link: "https://map.craftcore.org" #

homepage:
  link: "https://craftcore.org/stellaria"
  craftcore-link: "https://craftcore.org" #

vote:
  enabled: true

  reward:
    money: 500

  message:
    - "&%8----------------------------------"
    - ""
    - "  &%9&lサーバー投票"
    - ""
    - "  &%7サーバーに投票するとサーバー内通貨が貰えます。"
    - ""
    - "    %jms%     %mineportal%"
    - ""
    - "&%8----------------------------------"

  broadcast:
    enabled: true

    message:
      - "&%8----------------------------------"
      - ""
      - "  &%f%player% &%aさんが投票しました！"
      - ""
      - "  &%7サーバーに投票するとサーバー内通貨が貰えます。"
      - ""
      - "    %jms%     %mineportal%"
      - ""
      - "&%8----------------------------------"

  sites:
    jms:
      enabled: true
      name: "&%3&lJMS"
      url: "https://minecraft.jp/servers/stellaria.craftcore.org"
      tooltip: "&%7クリックして&%3JMS&%7の投票ページを開く"

    mineportal:
      enabled: true
      name: "&%d&lMinePortal"
      url: "https://mineportal.jp/servers/cmu54wi1o0000ofujlywoxbwk"
      tooltip: "&%7クリックして&%dMinePortal&%7の投票ページを開く"
rank:
  enabled: true
  default:
    color: "&%7"
  groups: # 上に書いた方が優先。luckperms-group はLuckPerms側の実グループ名
    - luckperms-group: "admin"
      color: "&%e"
      tablist-tag: "ᴀᴅᴍɪɴ"
      display-name: "管理者"
    - luckperms-group: "staff"
      color: "&%b"
      tablist-tag: "sᴛᴀꜰꜰ"
      display-name: "スタッフ"
    - luckperms-group: "booster"
      color: "&%d"
      tablist-tag: "ʙᴏᴏsᴛᴇʀ"
      display-name: "ブースター"

economy:
  default-balance: 1000 # 新規プレイヤーの初期所持金

world:
  gui-title: "&%9ワールドを選択"
  gui-rows: 3 # 1〜6で固定行数。0または範囲外ならワールド数から自動計算（例: 6）
  # GUIに表示するワールドのリスト。並び順がそのままGUIの配置順になります。
  # ワールド名(world)は必須。表示名(name)、カスタムヘッド(custom-head)、
  # 素材(material)、説明文(lore)、スロット(slot)は省略可能です。
  # ※ 未設定時はサーバー上の全ワールドを自動表示します。
  worlds:
    - world: "world"
      name: "&%a生活ワールド"
#      custom-head: "earth"
      material: GRASS_BLOCK
      slot: 11
      lore:
        - "&%7メインの生活ワールドです"

    - world: "lobby"
      name: "&%bロビー"
      custom-head: "earth"
      material: GRASS_BLOCK
      slot: 13
      lore:
        - "&%7ロビーワールドです"

    - world: "resource"
      name: "&%e資源ワールド"
#      custom-head: "earth"
      material: HAY_BLOCK
      slot: 15
      lore:
        - "&%7資源ワールドです"
  # Bukkit上のワールド名をGUIやプレースホルダーに表示する名前へ置き換える（未設定のワールドは元の名前を表示）
  # ※ 上記 worlds の各項目で name を指定した場合はそちらが優先されます
  display-names: {}
  # ワールド名ごとにcustomhead.ymlのヘッドIDを指定できる（上記 worlds の各項目で custom-head を指定した場合はそちらが優先）
  gui-custom-heads:
    world: "earth"

lobby:
  world: "lobby"

home:
  disabled-worlds: ["lobby"]
  max-per-player: 5
  cost: 0 # /sethome 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#FFAA00" # オレンジ
    size: 1.0
    radius: 1.0
    points: 30

warp:
  disabled-worlds: ["lobby"]
  max-per-player: 5
  cost: 0 # /setwarp 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#55FF55" # グリーン
    size: 1.0
    radius: 1.0
    points: 30

ranking:
  page-size: 10

profile:
  info-lines:
    - "&%7名前: &%f%player%"
    - "&%7プレイ時間: &%f%playtime%"
    - "&%7所持金: &%e%money%"

welcome:
  enabled: true # 初回ログイン時にウェルカムメッセージ（messages.yml の welcome.lines）を送るかどうか

first-join-kit:
  enabled: true
  items: # "素材名:個数" 形式（個数省略で1個）
    - "WOODEN_SWORD:1"
    - "WOODEN_AXE:1"
    - "WOODEN_PICKAXE:1"
    - "WOODEN_SHOVEL:1"
    - "COOKED_BEEF:16"
    - "OAK_LOG:16"

adminshop:
  enabled: true
  rows: 3
  items:
    - material: BREAD
      price: 10
      slot: 11
    - material: CARROT
      price: 8
      slot: 12
    - material: POTATO
      price: 8
      slot: 13
    - material: COOKED_BEEF
      price: 40
      slot: 14
    - material: OAK_LOG
      price: 20
      slot: 15

action-bar:
  enabled: true
  update-interval-ticks: 5
  separator: " &%7|&r " # 複数機能が同時にアクションバーを使うときの連結セパレータ
  persistent:
    enabled: false # 常時表示する固定テンプレートを使うかどうか
    template: ""

boss-bar:
  enabled: true
  update-interval-ticks: 5 # 期限切れチャンネル(flash)を消すためのチェック間隔。テンプレートは持たず、呼び出し側の機能がtitle/color/overlay/progressを渡す

scoreboard:
  title: "&%9&lすてらりあ"
  update-interval-ticks: 20
  hide-numbers: true
  lines:
    - ""
    - " &%bワールド&%7: &%f%world%  "
    - " &%b座標&%7: &%f%x%&%7,&%f %y%&%7,&%f %z%  "
    - " &%b所持金&%7: &%f%money%  "
    - ""


tablist:
  header: "\n&%b%player%さん\n           &%9すてらりあ &%bへようこそ！           \n"
  footer: "\n&%9%online%&%7/&%9%max_online%\n"
  value: "%afk%&%a%ping%ms"
  rank-prefix: "" # ランクタグの前に付ける区切り文字（ランク色で色付けされる）
  update-interval-ticks: 20

belowname:
  title: ""
  value: "%afk% &%c❤ &%7%health%"
  update-interval-ticks: 20

nametag:
  enabled: true
  dot-symbol: "●" # ネームタグ左端に付けるランク色ドット（ランク無しのプレイヤーには付かない）
  update-interval-ticks: 20

afk:
  enabled: true
  timeout-seconds: 300 # 何秒操作が無ければAFK扱いにするか
  actionbar-flash-seconds: 3 # AFK復帰通知をアクションバーに表示する秒数
  tag: "&c[&%c離席中&c] &r" # %afk% プレースホルダーの中身

chat:
  enabled: true
  format: "{placeholder}{sender}&%9: &%f{message}"
  placeholder: ""
  click-to-message: true
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  tooltip:
    enabled: true
    lines:
        - "&%7名前: &%f%player%"
        - "&%7Ping: &%a%ping%ms"
        - "&%7プレイ時間: &%b%playtime%"
        - "&%7所持金: &%e%money%"
        - ""

message:
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

mute:
  level3-command-blacklist: ["msg","tell","w","reply","r","tpa","tphere"] # Lv3ミュート中に禁止するコマンド名（例: ["msg","tell","w","reply","r"]）

moderation:
  warn-sound:
    enabled: true
    name: "BLOCK_NOTE_BLOCK_BASS"
    volume: 1.0
    pitch: 0.8

report:
  categories:
    - name: "&%c&l暴言"
      material: PAPER
      slot: 10
    - name: "&%e&lチート"
      material: PAPER
      slot: 12
    - name: "&%6&l荒らし"
      material: PAPER
      slot: 14
    - name: "&%7&lその他"
      material: PAPER
      slot: 16


tpa:
  teleport-delay-seconds: 5 # 承認後、実際にテレポートするまでの詠唱時間。0以下で即時テレポート。ダメージを受けるとキャンセルされる

teleport-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#55FFFF"
  size: 1.0
  radius: 1.0
  points: 30

join-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#4C2FB3"
  size: 1.0
  radius: 1.0
  points: 30

mention:
  enabled: true
  format: "&%e@{name}&r"
  all:
    enabled: true
    keyword: "all"
    permission: "stellaria.chat.mention.all"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

broadcast:
  auto:
    enabled: true
    interval-minutes: 15 # 本番は15
    messages: [
      "&%b&l| &r&%bDiscordサーバーはこちら！\n&%b&l| &r&%bhttps://discord.gg/ssaREjBJXg",
      "&%b&l| &r&%b荒らし、チートは禁止です！",
      "&%b&l| &r&%bバグや不具合を見つけたらDiscordで報告できます！",
    ] # 空だと定期放送は開始されない（例: ["&%eルールを守って楽しく遊ぼう！"]）

income:
  mining:
    rewards:
      COAL_ORE: 2
      COPPER_ORE: 2
      IRON_ORE: 5
      GOLD_ORE: 15
      REDSTONE_ORE: 5
      LAPIS_ORE: 5
      DIAMOND_ORE: 20
      EMERALD_ORE: 30
      NETHER_QUARTZ_ORE: 2
      NETHER_GOLD_ORE: 5
      ANCIENT_DEBRIS: 35

  fishing:
    rewards:
      COD: 20
      SALMON: 30
      PUFFERFISH: 500
      TROPICAL_FISH: 300

elevator:
  blocks:
    IRON_BLOCK:
      max: 10
    GOLD_BLOCK:
      max: 15
    DIAMOND_BLOCK:
      max: 50
  message:
    move_fail: "&%cこのエレベーターブロックには障害物があります"
    moveup_success: "&7↑"
    moveup_fail: "&%c行先のエレベーターブロックの上に障害物があります"
    movedown_success: "&7↓"
    movedown_fail: "&%c行先のエレベーターブロックの上に障害物があります"
  sound:
    moveup:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 1.0
    movedown:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 0.75
  ignoreblocks: ["&CARPET","&_SIGN","&TORCH","&BANNER","&BUTTON","&LEVER","&_DOOR"]# エレベーターブロックの上2ブロックに置いてあっても移動ができるブロック

weathervote:
  disabled-worlds: ["lobby"]
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"
    resource: "資源ワールド"

timevote:
  disabled-worlds: ["lobby"]
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"
    resource: "資源ワールド"


# world-time-sync.worlds に指定するワールドでは、時間投票を無効化するため
# disabled-worlds にも同じワールド名を追加してください。
world-time-sync:
  enabled: false
  worlds: []
  # 対象ワールド内で /gamerule advance_time false を実行してください。

kikori:
  disabled-worlds: ["lobby"]
  enabled: true
  price: 2000
  timeout-seconds: 300
  max-logs: 256
  leaf-radius: 4

mine:
  disabled-worlds: ["lobby"]
  enabled: true
  price: 3000
  timeout-seconds: 0
  max-ores: 128

land:
  disabled-worlds: ["lobby"]
  cost-per-chunk: 500
  max-chunks-per-player: 20
  refund-on-unclaim: true
  map-radius: 4 # /land map で表示する範囲（チャンク単位の半径）。4なら9x9マスのグリッドになる
  protect:
    explosions: true
    fire: true
    pistons: true
    liquid-flow: true
    hangings: true
  # ドア・トラップドア・フェンスゲートはバニラのTag（DOORS/TRAPDOORS/FENCE_GATES）で自動判定するため、
  # ここに個別リストは持たない（新種のドアが追加されても自動的に保護対象になる）。
  protected-containers: ["CHEST","TRAPPED_CHEST","BARREL","ENDER_CHEST","SHULKER_BOX","WHITE_SHULKER_BOX","ORANGE_SHULKER_BOX","MAGENTA_SHULKER_BOX","LIGHT_BLUE_SHULKER_BOX","YELLOW_SHULKER_BOX","LIME_SHULKER_BOX","PINK_SHULKER_BOX","GRAY_SHULKER_BOX","LIGHT_GRAY_SHULKER_BOX","CYAN_SHULKER_BOX","PURPLE_SHULKER_BOX","BLUE_SHULKER_BOX","BROWN_SHULKER_BOX","GREEN_SHULKER_BOX","RED_SHULKER_BOX","BLACK_SHULKER_BOX","FURNACE","BLAST_FURNACE","SMOKER","HOPPER","DISPENSER","DROPPER","BREWING_STAND","ANVIL","CRAFTER","CHISELED_BOOKSHELF","LECTERN","DECORATED_POT","BEACON"]
  border-particle:
    enabled: true
    particle: "DUST"
    color: "#55FF55"
    size: 1.0
    duration-seconds: 3
    # /land border の常時表示用設定。半径はプレイヤーの現在地を中心にしたチャンク単位。
    toggle-radius-default: 3
    toggle-interval-ticks: 20
    # /chunkborder や /land border <半径> で指定できる半径の上限（チャンク単位）。
    # これを超えるキャッシュ構築要求はサーバー負荷が跳ね上がるため拒否する。
    max-radius: 64

menu:
  rows: 5 # 1〜6。省略/範囲外の場合は5
  items:
    - slot: 0
      material: BLUE_ORCHID
      name: "&%b天気投票"
      action: "weathervote"
    - slot: 1
      material: CLOCK
      name: "&%6時間投票"
      action: "timevote"
    - slot: 8
      material: DARK_OAK_DOOR
      name: "&%9ホームページ"
      action: "homepage"
    - slot: 13
      material: PLAYER_HEAD
      name: "&%bプロフィール"
      action: "profile"
    - slot: 17
      material: SOUL_LANTERN
      name: "&%9Discord"
      action: "discord"
    - slot: 18
      material: LODESTONE
      name: "&%3ワープ"
      action: "warp"
    - slot: 19
      material: RED_BED
      name: "&%9ホーム"
      action: "home"
    - slot: 21
      material: COMPARATOR
      name: "&%c便利機能"
      action: "features"
    - slot: 23
      material: PLAYER_HEAD
      custom-head: "earth"
      name: "&%eワールド移動"
      action: "world"
    - slot: 26
      material: FILLED_MAP
      name: "&%2マップ"
      action: "map"
    - slot: 31
      material: ENDER_CHEST
      name: "&%2エンダーチェスト"
      action: "enderchest"
    - slot: 35
      material: EMERALD
      name: "&%aサーバー投票"
      action: "vote"
    - slot: 36
      material: SOUL_TORCH
      name: "&%a土地保護のヘルプ"
      action: "land-help"
    - slot: 37
      material: COPPER_TORCH
      name: "&%dテレポートリクエストの使い方"
      action: "tpa-help"
    - slot: 44
      material: COMPASS
      name: "&%9メニューアイテムを入手"
      action: "get-menu-item"
    - slot: 22
      material: SKELETON_SKULL
      name: "&%dヘッドショップ"
      action: "headshop"

menuitem:
  cooldown-seconds: 10 # メニューアイテムの再入手クールダウン

headshop:
  reset-time: "12:00"
  normal-price: 500
  player-head-markup: 300
  player-head-recent-days: 30

sudo:
  blacklist:
    - "stop"
    - "op"
    - "deop"
    - "ban"
    - "ban-ip"
    - "pardon"
    - "whitelist"
    - "save-all"
    - "save-off"
    - "save-on"
    - "reload"
    - "sudo"

lobbyprotect:
  enabled: true
  world-id: "lobby"
  
world-reset:
  enabled: false
  worlds: []
  # 退避先ワールド名。空文字ならBukkit上の最初のワールド（デフォルトのメインワールド）のスポーンへ退避する
  evacuate-to-world: ""
  schedule:
    type: "weekly" # "weekly" または "monthly"
    time: "12:00"            # 24時間表記、両モード共通
    # type: weekly のとき使用
    day-of-week: "FRIDAY"    # java.time.DayOfWeek の名前（大文字）
    interval-weeks: 1        # 1=毎週、2=隔週
    # type: monthly のとき使用
    day-of-month: 1          # 1〜31。その月に存在しない日は月末日に丸める

shop:
  max-per-player: 10
  creation-cost: 500
  input-timeout-seconds: 60
  max-price: 10000000
  display:
    y-offset: 1.2
    text-offset: 0.45
    view-range: 16
    buy-format: "&%a販売 &%f%price% &%e在庫 &%f%stock%"
    sell-format: "&%c買取 &%f%price% &%e在庫&%f%stock%"
