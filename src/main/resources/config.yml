# StellariaCore 設定ファイル

server:
  name: "Stellaria"
  prefix: "&%9&l| すてらりあ &r" # メッセージのPrefix !NOTE: 未実装

discord:
  invite: "https://discord.gg/ssaREjBJXg" # /discord で案内するサーバー招待リンク

map:
  link: "https://example.com/map" # TODO: 実際のマップURLに差し替え

homepage:
  link: "https://example.com"
  craftcore-link: "https://example.com/craftcore" # TODO: 実URLに差し替え

rank:
  enabled: true
  default:
    color: "&%7"
  groups: # 上に書いた方が優先。luckperms-group はLuckPerms側の実グループ名
    - luckperms-group: "admin"
      color: "&%e"
      tablist-tag: "ᴀᴅᴍɪɴ"
      display-name: "管理者"
    - luckperms-group: "staff"
      color: "&%b"
      tablist-tag: "sᴛᴀꜰꜰ"
      display-name: "スタッフ"
    - luckperms-group: "booster"
      color: "&%d"
      tablist-tag: "ʙᴏᴏsᴛᴇʀ"
      display-name: "ブースター"

economy:
  default-balance: 1000 # 新規プレイヤーの初期所持金

home:
  max-per-player: 5
  cost: 0 # /sethome 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#FFAA00" # オレンジ
    size: 1.0
    radius: 1.0
    points: 30

warp:
  max-per-player: 5
  cost: 0 # /setwarp 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#55FF55" # グリーン
    size: 1.0
    radius: 1.0
    points: 30

ranking:
  page-size: 10

first-join-kit:
  enabled: true
  items: # "素材名:個数" 形式（個数省略で1個）
    - "WOODEN_SWORD:1"
    - "WOODEN_AXE:1"
    - "WOODEN_PICKAXE:1"
    - "WOODEN_SHOVEL:1"
    - "COOKED_BEEF:16"
    - "OAK_LOG:16"

action-bar:
  enabled: true
  update-interval-ticks: 5
  separator: " | " # 複数機能が同時にアクションバーを使うときの連結セパレータ
  persistent:
    enabled: false # 常時表示する固定テンプレートを使うかどうか
    template: ""

boss-bar:
  enabled: true
  update-interval-ticks: 5 # 期限切れチャンネル(flash)を消すためのチェック間隔。テンプレートは持たず、呼び出し側の機能がtitle/color/overlay/progressを渡す

scoreboard:
  title: "&%9&lすてらりあ"
  update-interval-ticks: 20
  hide-numbers: true
  lines:
    - ""
    - " &%bオンライン&%7: &%f%online%&%7/&%f%max_online%"
    - " &%bワールド&%7: &%f%world%"
    - " &%b座標&%7: &%f%x%&%7,&%f %y%&%7,&%f %z%"
    - " &%b所持金&%7: &%f%money%"
    - ""


tablist:
  header: "\n&%b%player%さん\n           &%9すてらりあ &%bへようこそ！           \n"
  footer: "\n&%9%online%&%7/&%9%max_online%\n"
  value: "%afk%&%a%ping%ms"
  rank-prefix: "" # ランクタグの前に付ける区切り文字（ランク色で色付けされる）
  update-interval-ticks: 20

belowname:
  title: ""
  value: "%afk% &%c❤ &%7%health%"
  update-interval-ticks: 20

nametag:
  enabled: true
  dot-symbol: "●" # ネームタグ左端に付けるランク色ドット（ランク無しのプレイヤーには付かない）
  update-interval-ticks: 20

afk:
  enabled: true
  timeout-seconds: 300 # 何秒操作が無ければAFK扱いにするか
  actionbar-flash-seconds: 3 # AFK復帰通知をアクションバーに表示する秒数
  tag: "&c[&%c離席中&c] &r" # %afk% プレースホルダーの中身

chat:
  enabled: true
  format: "{placeholder}{sender}&%9: &%f{message}"
  placeholder: ""
  click-to-message: true
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  tooltip:
    enabled: true
    lines:
#      - "&%7Ping: &%f%ping%ms"
#      - "&%7所持金: &%e%money%"

message:
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

mute:
  level3-command-blacklist: ["msg","tell","w","reply","r","tpa","tphere"] # Lv3ミュート中に禁止するコマンド名（例: ["msg","tell","w","reply","r"]）

tpa:
  teleport-delay-seconds: 5 # 承認後、実際にテレポートするまでの詠唱時間。0以下で即時テレポート。ダメージを受けるとキャンセルされる

teleport-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#55FFFF"
  size: 1.0
  radius: 1.0
  points: 30

join-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#4C2FB3"
  size: 1.0
  radius: 1.0
  points: 30

mention:
  enabled: true
  format: "&%e@{name}&r"
  all:
    enabled: true
    keyword: "all"
    permission: "stellaria.chat.mention.all"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

broadcast:
  auto:
    enabled: true
    interval-minutes: 15 # 本番は15
    messages: [
      "&%b&l| &r&%bDiscordサーバーはこちら！\n&%b&l| &r&%bhttps://discord.gg/ssaREjBJXg",
      "&%b&l| &r&%b荒らし、チートは禁止です！",
      "&%b&l| &r&%bバグや不具合を見つけたらDiscordで報告できます！",
    ] # 空だと定期放送は開始されない（例: ["&%eルールを守って楽しく遊ぼう！"]）

elevator:
  blocks:
    IRON_BLOCK:
      max: 10
    GOLD_BLOCK:
      max: 15
    DIAMOND_BLOCK:
      max: 50
  message:
    move_fail: "&%cこのエレベーターブロックには障害物があります"
    moveup_success: "&7↑"
    moveup_fail: "&%c行先のエレベーターブロックの上に障害物があります"
    movedown_success: "&7↓"
    movedown_fail: "&%c行先のエレベーターブロックの上に障害物があります"
  sound:
    moveup:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 1.0
    movedown:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 0.75
  ignoreblocks: ["&CARPET","&_SIGN","&TORCH","&BANNER","&BUTTON","&LEVER","&_DOOR"]# エレベーターブロックの上2ブロックに置いてあっても移動ができるブロック

weathervote:
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"

timevote:
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"

kikori:
  enabled: true
  price: 2000
  timeout-seconds: 300
  max-logs: 256
  leaf-radius: 4

land:
  enabled-worlds: ["world"]
  cost-per-chunk: 500
  max-chunks-per-player: 20
  refund-on-unclaim: true
  map-radius: 4 # /land map で表示する範囲（チャンク単位の半径）。4なら9x9マスのグリッドになる
  protect:
    explosions: true
    fire: true
    pistons: true
    liquid-flow: true
    hangings: true
  # ドア・トラップドア・フェンスゲートはバニラのTag（DOORS/TRAPDOORS/FENCE_GATES）で自動判定するため、
  # ここに個別リストは持たない（新種のドアが追加されても自動的に保護対象になる）。
  protected-containers: ["CHEST","TRAPPED_CHEST","BARREL","ENDER_CHEST","SHULKER_BOX","WHITE_SHULKER_BOX","ORANGE_SHULKER_BOX","MAGENTA_SHULKER_BOX","LIGHT_BLUE_SHULKER_BOX","YELLOW_SHULKER_BOX","LIME_SHULKER_BOX","PINK_SHULKER_BOX","GRAY_SHULKER_BOX","LIGHT_GRAY_SHULKER_BOX","CYAN_SHULKER_BOX","PURPLE_SHULKER_BOX","BLUE_SHULKER_BOX","BROWN_SHULKER_BOX","GREEN_SHULKER_BOX","RED_SHULKER_BOX","BLACK_SHULKER_BOX","FURNACE","BLAST_FURNACE","SMOKER","HOPPER","DISPENSER","DROPPER","BREWING_STAND","ANVIL","CRAFTER","CHISELED_BOOKSHELF","LECTERN","DECORATED_POT","BEACON"]
  border-particle:
    enabled: true
    particle: "DUST"
    color: "#55FF55"
    size: 1.0
    duration-seconds: 3
