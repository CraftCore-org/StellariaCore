menuitem:
  cooldown-seconds: 10 # メニューアイテムの再入手クールダウン

headshop:
  reset-time: "12:00"
  normal-price: 500
  player-head-markup: 300
  player-head-recent-days: 30

sudo:
  blacklist:
    - "stop"
    - "op"
    - "deop"
    - "ban"
    - "ban-ip"
    - "pardon"
    - "whitelist"
    - "save-all"
    - "save-off"
    - "save-on"
    - "reload"
    - "sudo"

lobbyprotect:
  enabled: true
  world-id: "lobby"

world-reset:
  enabled: false
  worlds: ["resource", "resource_nether", "resource_the_end"]
  # 退避先ワールド名。空文字ならBukkit上の最初のワールド（デフォルトのメインワールド）のスポーンへ退避する
  evacuate-to-world: "lobby"
  schedule:
    type: "weekly" # "weekly" または "monthly"
    time: "12:00"            # 24時間表記、両モード共通
    # type: weekly のとき使用
    day-of-week: "FRIDAY"    # java.time.DayOfWeek の名前（大文字）
    interval-weeks: 1        # 1=毎週、2=隔週
    # type: monthly のとき使用
    day-of-month: 1          # 1〜31。その月に存在しない日は月末日に丸める

shop:
  max-per-player: 30
  creation-cost: 200
  input-timeout-seconds: 60
  max-price: 10000000
  display:
    y-offset: 1.2
    text-offset: 0.45
    view-range: 16
    buy-format: "&%a販売 &%f%price% &%e在庫 &%f%stock%"
    sell-format: "&%c買取 &%f%price% &%e在庫&%f%stock%"

# カスタムエンチャント（StellariaEnchants で登録したエンチャントの効果の調整値）
# 最大レベル・対応アイテム・出現しやすさは StellariaEnchants 側の定義で、変更には再起動が必要。
custom-enchants:
  # 移動系（二段跳び・跳躍・滑空加速）が発動できる最低の満腹度。6以下（ダッシュできない値）では発動しない
  movement:
    min-food-level: 7
  pursuit:
    chance-per-level: 0.10      # 追撃の発動確率（レベル×この値）
    delay-ticks: 8              # 本命の攻撃から追撃までの間隔
    damage-multiplier: 0.5      # 元のダメージに対する追撃ダメージの倍率
  lifesteal:
    heal-per-level: 2.0         # 倒したときの回復量（HP、2でハート1個）×レベル
  last-stand:
    health-threshold: 0.3       # 最大体力に対する割合。これ以下になったら発動
    duration-ticks: 200
    speed-amplifier: 1          # 0=移動速度I、1=移動速度II
    strength-amplifier: 0       # 0=攻撃力上昇I
    cooldown-seconds: 180       # 背水が再び発動できるまでの秒数
  harvest:
    chance-per-level: 0.05      # 作物1個ごとに上質作物になる確率（レベル×この値）
  glide-boost:
    interval-seconds: [15, 12, 10]   # レベルI/II/IIIの加速間隔
    strength: 0.6
    exhaustion: 1.5
  launch:
    charge-ticks: 30
    velocity: [1.4, 1.9]        # レベルI/IIの打ち上げの速さ
    exhaustion: 3.0
  double-jump:
    velocity-y: 0.6
    forward: 0.3
    exhaustion: 1.0
  angler:
    streak-window-seconds: 60   # 前回の釣り上げからこの秒数以内なら連続扱い
    base-amount: 5
    max-streak: 10
    level-multipliers: [1.0, 1.5, 2.0]
    daily-cap: 3000             # 1日（日本時間0時リセット）の支払い上限
  excavation:
    ancient-city-chance: 0.10   # 古代都市のチェスト1個ごとに、範囲破壊の本が入る確率（0.0〜1.0）
    min-durability: 10          # 道具の残り耐久値がこの値を下回ると範囲破壊を止め、中心の1ブロックだけ掘る
