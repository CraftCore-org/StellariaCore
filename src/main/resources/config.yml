# StellariaCore 設定ファイル

server:
  name: "Stellaria"
  prefix: "&%9&l| すてらりあ &r" # メッセージのPrefix !NOTE: 未実装

discord:
  invite: "https://discord.gg/ssaREjBJXg" # /discord で案内するサーバー招待リンク
  bot:
    enabled: true
    token: ""
    admin-guild-id: ""
    server-guild-id: ""
    serverchat-channel-id: [""]
    serverconsole-channel-id: [""]
    serverstartlog-format: "✅ サーバーが起動しました。"
    serverstoplog-format: "❌ サーバーが停止しました。"
    serverchat-format: "%player%: %message%"
    discordchat-format: "&%7[&%9Discord&%7] &%7%username%&%8: &r%message%"
    joinlog-format: "%player%が参加しました。"
    quitlog-format: "%player%が退出しました。"

map:
  link: "https://map.craftcore.org" #

homepage:
  link: "https://craftcore.org/stellaria"
  craftcore-link: "https://craftcore.org" #

vote:
  enabled: true
  reward:
    money: 500
  sites:
    mineportal: "https://example.com/mineportal" # TODO: 実際の投票URLに差し替え
    minecraftjp: "https://example.com/minecraftjp" # TODO: 実際の投票URLに差し替え

rank:
  enabled: true
  default:
    color: "&%7"
  groups: # 上に書いた方が優先。luckperms-group はLuckPerms側の実グループ名
    - luckperms-group: "admin"
      color: "&%e"
      tablist-tag: "ᴀᴅᴍɪɴ"
      display-name: "管理者"
    - luckperms-group: "staff"
      color: "&%b"
      tablist-tag: "sᴛᴀꜰꜰ"
      display-name: "スタッフ"
    - luckperms-group: "booster"
      color: "&%d"
      tablist-tag: "ʙᴏᴏsᴛᴇʀ"
      display-name: "ブースター"

economy:
  default-balance: 1000 # 新規プレイヤーの初期所持金

world:
  gui-title: "&%9ワールドを選択"
  gui-rows: 0 # 1〜6で固定行数。0または範囲外ならワールド数から自動計算（例: 6）
  # Bukkit上のワールド名をGUIに表示する名前へ置き換える（未設定のワールドは元の名前を表示）
  #   world: "生活ワールド"
  #   world_nether: "ネザー"
  display-names: {}

home:
  disabled-worlds: []
  max-per-player: 5
  cost: 0 # /sethome 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#FFAA00" # オレンジ
    size: 1.0
    radius: 1.0
    points: 30

warp:
  disabled-worlds: []
  max-per-player: 5
  cost: 0 # /setwarp 1回あたりの消費コイン数（0なら無料）
  teleport-effect:
    enabled: true
    particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
    color: "#55FF55" # グリーン
    size: 1.0
    radius: 1.0
    points: 30

ranking:
  page-size: 10

profile:
  info-lines:
    - "&%7名前: &%f%player%"
    - "&%7プレイ時間: &%f%playtime%"
    - "&%7所持金: &%e%money%"

first-join-kit:
  enabled: true
  items: # "素材名:個数" 形式（個数省略で1個）
    - "WOODEN_SWORD:1"
    - "WOODEN_AXE:1"
    - "WOODEN_PICKAXE:1"
    - "WOODEN_SHOVEL:1"
    - "COOKED_BEEF:16"
    - "OAK_LOG:16"

adminshop:
  enabled: true
  # rows: 6 # 省略時は商品数に応じて自動決定（1〜6）
  items:
    - material: BREAD
      price: 10
      # slot: 0 # 省略時は空いているスロットへ自動配置
    - material: CARROT
      price: 8
    - material: POTATO
      price: 8
    - material: COOKED_BEEF
      price: 40
    - material: OAK_LOG
      price: 20

action-bar:
  enabled: true
  update-interval-ticks: 5
  separator: " &%7|&r " # 複数機能が同時にアクションバーを使うときの連結セパレータ
  persistent:
    enabled: false # 常時表示する固定テンプレートを使うかどうか
    template: ""

boss-bar:
  enabled: true
  update-interval-ticks: 5 # 期限切れチャンネル(flash)を消すためのチェック間隔。テンプレートは持たず、呼び出し側の機能がtitle/color/overlay/progressを渡す

scoreboard:
  title: "&%9&lすてらりあ"
  update-interval-ticks: 20
  hide-numbers: true
  lines:
    - ""
    - " &%bワールド&%7: &%f%world%"
    - " &%b座標&%7: &%f%x%&%7,&%f %y%&%7,&%f %z%"
    - " &%b所持金&%7: &%f%money%"
    - ""


tablist:
  header: "\n&%b%player%さん\n           &%9すてらりあ &%bへようこそ！           \n"
  footer: "\n&%9%online%&%7/&%9%max_online%\n"
  value: "%afk%&%a%ping%ms"
  rank-prefix: "" # ランクタグの前に付ける区切り文字（ランク色で色付けされる）
  update-interval-ticks: 20

belowname:
  title: ""
  value: "%afk% &%c❤ &%7%health%"
  update-interval-ticks: 20

nametag:
  enabled: true
  dot-symbol: "●" # ネームタグ左端に付けるランク色ドット（ランク無しのプレイヤーには付かない）
  update-interval-ticks: 20

afk:
  enabled: true
  timeout-seconds: 300 # 何秒操作が無ければAFK扱いにするか
  actionbar-flash-seconds: 3 # AFK復帰通知をアクションバーに表示する秒数
  tag: "&c[&%c離席中&c] &r" # %afk% プレースホルダーの中身

chat:
  enabled: true
  format: "{placeholder}{sender}&%9: &%f{message}"
  placeholder: ""
  click-to-message: true
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  tooltip:
    enabled: true
    lines:
        - "&%7名前: &%f%player%"
        - "&%7Ping: &%a%ping%ms"
        - "&%7プレイ時間: &%b%playtime%"
        - "&%7所持金: &%e%money%"
        - ""

message:
  color-codes:
    enabled: true
    permission: "stellaria.chat.color"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

mute:
  level3-command-blacklist: ["msg","tell","w","reply","r","tpa","tphere"] # Lv3ミュート中に禁止するコマンド名（例: ["msg","tell","w","reply","r"]）

tpa:
  teleport-delay-seconds: 5 # 承認後、実際にテレポートするまでの詠唱時間。0以下で即時テレポート。ダメージを受けるとキャンセルされる

teleport-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#55FFFF"
  size: 1.0
  radius: 1.0
  points: 30

join-effect:
  enabled: true
  particle: "DUST" # Bukkitの Particle enum名。DUSTの時だけ color/size が使われる
  color: "#4C2FB3"
  size: 1.0
  radius: 1.0
  points: 30

mention:
  enabled: true
  format: "&%e@{name}&r"
  all:
    enabled: true
    keyword: "all"
    permission: "stellaria.chat.mention.all"
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.0

broadcast:
  auto:
    enabled: true
    interval-minutes: 15 # 本番は15
    messages: [
      "&%b&l| &r&%bDiscordサーバーはこちら！\n&%b&l| &r&%bhttps://discord.gg/ssaREjBJXg",
      "&%b&l| &r&%b荒らし、チートは禁止です！",
      "&%b&l| &r&%bバグや不具合を見つけたらDiscordで報告できます！",
    ] # 空だと定期放送は開始されない（例: ["&%eルールを守って楽しく遊ぼう！"]）

elevator:
  blocks:
    IRON_BLOCK:
      max: 10
    GOLD_BLOCK:
      max: 15
    DIAMOND_BLOCK:
      max: 50
  message:
    move_fail: "&%cこのエレベーターブロックには障害物があります"
    moveup_success: "&7↑"
    moveup_fail: "&%c行先のエレベーターブロックの上に障害物があります"
    movedown_success: "&7↓"
    movedown_fail: "&%c行先のエレベーターブロックの上に障害物があります"
  sound:
    moveup:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 1.0
    movedown:
      name: "BLOCK_PISTON_EXTEND"
      volume: 1.0
      pitch: 0.75
  ignoreblocks: ["&CARPET","&_SIGN","&TORCH","&BANNER","&BUTTON","&LEVER","&_DOOR"]# エレベーターブロックの上2ブロックに置いてあっても移動ができるブロック

weathervote:
  disabled-worlds: []
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"

timevote:
  disabled-worlds: []
  votetime: 15
  worldname: #ワールドの表示名 指定されていないワールドは投票不可能
    world: "生活ワールド"

kikori:
  disabled-worlds: []
  enabled: true
  price: 2000
  timeout-seconds: 300
  max-logs: 256
  leaf-radius: 4

mine:
  disabled-worlds: []
  enabled: true
  price: 3000
  timeout-seconds: 300
  max-ores: 128

land:
  disabled-worlds: []
  cost-per-chunk: 500
  max-chunks-per-player: 20
  refund-on-unclaim: true
  map-radius: 4 # /land map で表示する範囲（チャンク単位の半径）。4なら9x9マスのグリッドになる
  protect:
    explosions: true
    fire: true
    pistons: true
    liquid-flow: true
    hangings: true
  # ドア・トラップドア・フェンスゲートはバニラのTag（DOORS/TRAPDOORS/FENCE_GATES）で自動判定するため、
  # ここに個別リストは持たない（新種のドアが追加されても自動的に保護対象になる）。
  protected-containers: ["CHEST","TRAPPED_CHEST","BARREL","ENDER_CHEST","SHULKER_BOX","WHITE_SHULKER_BOX","ORANGE_SHULKER_BOX","MAGENTA_SHULKER_BOX","LIGHT_BLUE_SHULKER_BOX","YELLOW_SHULKER_BOX","LIME_SHULKER_BOX","PINK_SHULKER_BOX","GRAY_SHULKER_BOX","LIGHT_GRAY_SHULKER_BOX","CYAN_SHULKER_BOX","PURPLE_SHULKER_BOX","BLUE_SHULKER_BOX","BROWN_SHULKER_BOX","GREEN_SHULKER_BOX","RED_SHULKER_BOX","BLACK_SHULKER_BOX","FURNACE","BLAST_FURNACE","SMOKER","HOPPER","DISPENSER","DROPPER","BREWING_STAND","ANVIL","CRAFTER","CHISELED_BOOKSHELF","LECTERN","DECORATED_POT","BEACON"]
  border-particle:
    enabled: true
    particle: "DUST"
    color: "#55FF55"
    size: 1.0
    duration-seconds: 3
    # /land border の常時表示用設定。半径はプレイヤーの現在地を中心にしたチャンク単位。
    toggle-radius-default: 3
    toggle-interval-ticks: 20

menu:
  rows: 5 # 1〜6。省略/範囲外の場合は5
  items:
    - slot: 0
      material: LIGHTNING_ROD
      name: "&%b天気投票"
      action: "weathervote"
    - slot: 1
      material: CLOCK
      name: "&%6時間投票"
      action: "timevote"
    - slot: 8
      material: DARK_OAK_DOOR
      name: "&%9ホームページ"
      action: "homepage"
    - slot: 13
      material: PLAYER_HEAD
      name: "&%bプロフィール"
      action: "profile"
    - slot: 17
      material: PAPER
      name: "&%9Discord"
      action: "discord"
    - slot: 18
      material: LODESTONE
      name: "&%3ワープ"
      action: "warp"
    - slot: 19
      material: RED_BED
      name: "&%9ホーム"
      action: "home"
    - slot: 21
      material: REDSTONE
      name: "&%c便利機能"
      action: "features"
    - slot: 23
      material: COMPASS
      name: "&%eワールド移動"
      action: "world"
    - slot: 26
      material: FILLED_MAP
      name: "&%2マップ"
      action: "map"
    - slot: 31
      material: ENDER_CHEST
      name: "&%8エンダーチェスト"
      action: "enderchest"
    - slot: 35
      material: EMERALD
      name: "&%aサーバー投票"
      action: "vote"
    - slot: 36
      material: SHIELD
      name: "&%a土地保護のヘルプ"
      action: "land-help"
    - slot: 37
      material: ENDER_PEARL
      name: "&%dテレポートリクエストの使い方"
      action: "tpa-help"
    - slot: 44
      material: COMPASS
      name: "&%9メニューアイテムを入手"
      action: "get-menu-item"
    - slot: 22
      material: SKELETON_SKULL
      name: "&%dヘッドショップ"
      action: "headshop"

menuitem:
  cooldown-seconds: 10 # メニューアイテムの再入手クールダウン

headshop:
  reset-time: "12:00"
  normal-price: 500
  player-head-markup: 300
  player-head-recent-days: 30
