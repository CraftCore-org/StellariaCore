# StellariaCore メッセージファイル

join: "&%a> &%f%player%&%7 さんがログインしました。"
join-first: "&%e✳ &%f%player%&%7 さんが初めてサーバーにログインしました！"
quit: "&%c< &%f%player%&%7 さんがログアウトしました。"

gui:
  back: "&%7← 戻る"
  confirm: "&%a確認"
  cancel: "&%cキャンセル"

# 初回ログイン時にだけ本人へ送るウェルカムメッセージ（config.ymlのwelcome.enabledで有効/無効を切替）
welcome:
  lines:
    - ""
    - "&%9&l| &%9&lすてらりあへようこそ！"
    - "&%7参加ありがとうございます、%player%さん。"
    - "&%7サーバーを利用する前に、必ず &%f/rules &%7でルールを確認してください。"
    - ""

rules:
  lines:
    - ""
    - "&%9&l| &%9&lすてらりあ サーバールール"
    - ""
    - "&%f1. &%7チート・不正Mod、荒らし・盗難・迷惑行為は禁止です"
    - "&%f2. &%7チャットでは節度を守ってください（誹謗中傷・差別的発言・無断宣伝の禁止）"
    - "&%f3. &%7RMT（リアルマネートレード）は禁止です"
    - "&%f4. &%7土地は保護システムで自分で守ってください。未保護の被害は復旧できない場合があります"
    - "&%f5. &%7バグ・不具合は悪用せず運営へ報告してください"
    - "&%f6. &%7サブアカウントの使用は原則禁止です"
    - "&%f7. &%790日以上ログインが無い未保護の建築物は整理される場合があります"
    - ""
    - "&%7違反時は内容に応じて警告・ミュート・キック・BAN等の対応を行います。"
    - "&%7参加した時点で、利用規約・プライバシーポリシーおよび本ルールに同意したものとします。"
    - ""
    - "&%7利用規約&%8: &%bhttps://craftcore.org/terms"
    - "&%7プライバシーポリシー&%8: &%bhttps://craftcore.org/privacy"
    - ""

